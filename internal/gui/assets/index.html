<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenXPlay Flasher</title>
  <script src="/boot.js"></script>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="install-running-warning" class="warning running-warning" role="alert" hidden></div>
  <header class="top">
    <img class="logo" src="/logo.png" alt="" width="40" height="40">
    <div class="title">
      <h1 data-t="OpenXPlay Flasher">OpenXPlay Flasher</h1>
      <p class="sub" data-t="Install the OpenXPlay relay on supported devices, from scratch or one layer at a time.">Install the OpenXPlay relay on supported devices, from scratch or one layer at a time.</p>
    </div>
    <div class="lang" role="group" aria-label="Language" data-ta="Language">
      <button type="button" data-lang="zh-CN" data-t="中文">中文</button>
      <button type="button" data-lang="en" data-t="English">English</button>
      <button type="button" data-lang="" data-t="Follow the system">Follow the system</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views" data-ta="Views">
    <button type="button" role="tab" data-view="install" aria-selected="true" data-t="Install and update">Install and update</button>
    <button type="button" role="tab" data-view="config" aria-selected="false" data-t="Configuration">Configuration</button>
    <button type="button" role="tab" data-view="settings" aria-selected="false" data-t="Settings">Settings</button>
  </nav>

  <div id="view-install">
  <div id="signature-off-notice" class="warning signature-notice" role="status" hidden></div>
  <ol class="steps" aria-label="Steps" data-ta="Steps">
    <li class="current"><button type="button" data-install-step="0" data-t="Connect">Connect</button></li>
    <li><button type="button" data-install-step="1" data-t="Choose" disabled>Choose</button></li>
    <li><button type="button" data-install-step="2" data-t="Prepare" disabled>Prepare</button></li>
    <li data-t="Back up">Back up</li>
    <li data-t="Flash">Flash</li>
    <li data-t="Done">Done</li>
  </ol>

  <main>
    <section id="install-connect" class="card" aria-live="polite">
      <h2 data-t="Connect your device">Connect your device</h2>
      <div id="device-selection"></div>
      <div id="devices" class="devices"></div>
    </section>
    <section id="install" class="card install"></section>
  </main>
  </div>

  <main id="view-config" hidden>
    <section id="config" class="card config"></section>
  </main>

  <main id="view-settings" hidden>
    <div id="settings" class="settings"></div>
  </main>

  <footer class="foot">
    <span id="version"></span>
    <span class="sep">·</span>
    <span id="license"></span>
    <span class="sep">·</span>
    <a data-help="source" data-open data-t="Powered by OpenXPlay.">Powered by OpenXPlay.</a>
    <span class="sep">·</span>
    <a data-help="tutorial" data-open data-t="Tutorial">Tutorial</a>
    <span class="sep">·</span>
    <a data-help="download" data-open data-t="Download">Download</a>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
