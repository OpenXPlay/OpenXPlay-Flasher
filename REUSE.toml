    "build/icon/flasher-art.png",
    "build/icon/flasher-macos.png",
    "build/icon/flasher.png",
    "build/darwin/openxplay-flasher.icns",
    "build/windows/icon-*.png",
    "internal/gui/icon.png",
    "internal/gui/assets/logo.png",
]
